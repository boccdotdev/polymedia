name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, curl, dom, json, mbstring, openssl, pcre, pdo, pdo_sqlite, zip
          coverage: none
          tools: composer:v2

      - name: Get Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php-${{ matrix.php }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: PHPUnit
        run: composer test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install JS test dependencies
        run: npm ci --prefix tests/js --ignore-scripts

      # Composer ships Craft's built CP assets only. Native upload routing relies
      # on how Craft's Uploader.js checks file kinds, so test against the source
      # of the installed version rather than a stand-in.
      - name: Fetch Craft's Uploader.js for the installed version
        run: |
          version=$(jq -r '.packages[] | select(.name == "craftcms/cms") | .version' composer.lock)
          curl -fsSL "https://raw.githubusercontent.com/craftcms/cms/${version}/src/web/assets/cp/src/js/Uploader.js" -o "$RUNNER_TEMP/Uploader.js"
          echo "POLYMEDIA_CRAFT_UPLOADER_SOURCE=$RUNNER_TEMP/Uploader.js" >> "$GITHUB_ENV"
          echo "POLYMEDIA_REQUIRE_CRAFT_UPLOADER=1" >> "$GITHUB_ENV"

      - name: CP JavaScript regression tests
        run: composer test-js

      - name: Easy Coding Standard
        run: composer check-cs

      - name: PHPStan
        run: composer phpstan
